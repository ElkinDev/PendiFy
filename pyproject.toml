[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pendify"
version = "0.1.0"
description = "Pairs this PC with a phone account by a QR on a loopback page and sends it two kinds of alerts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

# pip lays the icon beside the modules; install.ps1 points the shortcuts at it.
[tool.setuptools.package-data]
pendify = ["*.ico"]
